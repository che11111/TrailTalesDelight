  trailandtales_delight:sniffer_eggshell:
    settings:
      hardness: 0.5
      resistance: 0.5
      push-reaction: destroy
      can-occlude: false
      is-view-blocking: false
      light-dampening: 0
      support_shape: minecraft:sniffer_egg[hatch=0]
      sounds:
        break: minecraft:block.metal.break
        fall: minecraft:block.metal.fall
        hit: minecraft:block.metal.hit
        place: minecraft:block.metal.place
        step: minecraft:block.metal.step
    loot:
      template: default:loot_table/self
    states:
      appearances:
        shell:
          state: barrier
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:sniffer_eggshell_display
            scale: 1.0
            translation: 0,0,0

  trailandtales_delight:curd_block:
    settings:
      hardness: 0.5
      resistance: 6
      push-reaction: destroy
      can-occlude: false
      is-view-blocking: false
      is-randomly-ticking: true
      light-dampening: 0
      support_shape: minecraft:air
      sounds:
        break: minecraft:block.honey_block.break
        fall: minecraft:block.honey_block.fall
        hit: minecraft:block.honey_block.hit
        place: minecraft:block.honey_block.place
        step: minecraft:block.honey_block.step
    behavior:
      - type: trailandtales_delight:curd_aging
        mature-block: trailandtales_delight:cheese_wheel
        max-light: 8
        age-step: 1
    loot:
      template: default:loot_table/self
    states:
      properties:
        age:
          type: int
          default: 0
          range: 0~3
      appearances:
        curd:
          state: structure_void
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:curd_block_display
            scale: 1.0
            translation: 0,0,0

  trailandtales_delight:budding_lantern_fruit:
    settings:
      hardness: 0
      push-reaction: destroy
      can-occlude: false
      is-view-blocking: false
      is-randomly-ticking: true
      light-dampening: 0
      support_shape: minecraft:wheat[age=0]
      tags:
        - minecraft:crops
        - minecraft:maintains_farmland
        - minecraft:bee_growables
      sounds:
        break: minecraft:block.crop.break
        place: minecraft:item.crop.plant
        hit: minecraft:block.grass.hit
        step: minecraft:block.grass.step
    behaviors:
      - type: liquid_flowable_block
      - type: crop_block
        grow-speed: 0.25
        light-requirement: 9
        is-bone-meal-target: true
        bone-meal-age-bonus:
          type: uniform
          min: 1
          max: 4
      - type: bush_block
        bottom-blocks:
          - minecraft:farmland
          - farmersdelight:rich_soil_farmland
      - type: trailandtales_delight:budding_transition
        mature-block: trailandtales_delight:lantern_fruits
    states:
      properties:
        age:
          type: int
          default: 0
          range: 0~4
      appearances:
        age_0:
          auto_state: lower_tripwire
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:budding_lantern_fruit_display_0
            scale: 1.0
            translation: 0,0,0
        age_1:
          auto_state: lower_tripwire
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:budding_lantern_fruit_display_1
            scale: 1.0
            translation: 0,0,0
        age_2:
          auto_state: higher_tripwire
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:budding_lantern_fruit_display_2
            scale: 1.0
            translation: 0,0,0
        age_3:
          auto_state: higher_tripwire
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:budding_lantern_fruit_display_3
            scale: 1.0
            translation: 0,0,0
      variants:
        age=0:
          appearance: age_0
        age=1:
          appearance: age_1
        age=2:
          appearance: age_2
        age=3:
          appearance: age_3
        age=4:
          appearance: age_3
    loot:
      pools:
        - rolls: 1
          conditions:
            - type: survives_explosion
          entries:
            - type: item
              item: trailandtales_delight:lantern_fruit_seeds
              count: 1

  trailandtales_delight:lantern_fruits:
    settings:
      hardness: 0
      push-reaction: destroy
      can-occlude: false
      is-view-blocking: false
      is-randomly-ticking: true
      light-dampening: 0
      support_shape: minecraft:wheat[age=0]
      tags:
        - minecraft:crops
        - minecraft:maintains_farmland
        - minecraft:bee_growables
      sounds:
        break: minecraft:block.crop.break
        place: minecraft:item.crop.plant
        hit: minecraft:block.grass.hit
        step: minecraft:block.grass.step
    behaviors:
      - type: liquid_flowable_block
      - type: crop_block
        grow-speed: 0.25
        light-requirement: 9
        is-bone-meal-target: true
        bone-meal-age-bonus:
          type: uniform
          min: 1
          max: 2
      - type: bush_block
        bottom-blocks:
          - minecraft:farmland
          - farmersdelight:rich_soil_farmland
    states:
      properties:
        age:
          type: int
          default: 0
          range: 0~3
      appearances:
        age_0:
          auto_state: lower_tripwire
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:lantern_fruits_display_0
            scale: 1.0
            translation: 0,0,0
        age_1:
          auto_state: lower_tripwire
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:lantern_fruits_display_1
            scale: 1.0
            translation: 0,0,0
        age_2:
          auto_state: higher_tripwire
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:lantern_fruits_display_2
            scale: 1.0
            translation: 0,0,0
        age_3:
          auto_state: higher_tripwire
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:lantern_fruits_display_3
            scale: 1.0
            translation: 0,0,0
      variants:
        age=0:
          appearance: age_0
        age=1:
          appearance: age_1
        age=2:
          appearance: age_2
        age=3:
          appearance: age_3
    events:
      - on: right_click
        conditions:
          - type: test_flag
            flag: interact
          - type: match_block_property
            properties:
              age: 3
        functions:
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.5
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: trailandtales_delight:lantern_fruit
                      functions:
                        - type: set_count
                          count:
                            type: uniform
                            min: 1
                            max: 2
                - rolls: 1
                  conditions:
                    - type: random
                      value: 0.05
                  entries:
                    - type: item
                      item: trailandtales_delight:golden_lantern_fruit
                      count: 1
          - type: update_block_property
            properties:
              age: 0
          - type: swing_hand
          - type: play_sound
            sound: farmersdelight:block.tomato_bush.pick_tomatoes
          - type: cancel_event
    loot:
      functions:
        - type: explosion_decay
      pools:
        - rolls: 1
          entries:
            - type: item
              item: trailandtales_delight:lantern_fruit_seeds
              count: 1
        - rolls: 1
          conditions:
            - type: match_block_property
              properties:
                age: 3
          entries:
            - type: item
              item: trailandtales_delight:lantern_fruit
              functions:
                - type: set_count
                  count:
                    type: uniform
                    min: 1
                    max: 2
