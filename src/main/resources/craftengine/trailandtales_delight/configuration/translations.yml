translations:
  en:
    gui.special_recipe.trailandtales_delight.curd_aging.title: "Curd Aging"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.0: "Place a curd block where the light level is 8 or lower."
    gui.special_recipe.trailandtales_delight.curd_aging.desc.1: "After some time, it ripens into a cheese wheel."
    gui.special_recipe.trailandtales_delight.curd_aging.input: "Curd Block"
    gui.special_recipe.trailandtales_delight.curd_aging.output: "Cheese Wheel"
  zh_cn:
    gui.special_recipe.trailandtales_delight.curd_aging.title: "凝乳块熟成"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.0: "将凝乳块放置在亮度不高于 8 的地方。"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.1: "静置一段时间后，它会熟成为奶酪轮。"
    gui.special_recipe.trailandtales_delight.curd_aging.input: "凝乳块"
    gui.special_recipe.trailandtales_delight.curd_aging.output: "奶酪轮"
  ja_jp:
    gui.special_recipe.trailandtales_delight.curd_aging.title: "凝乳の熟成"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.0: "凝乳ブロックを明るさ8以下の場所に置きます。"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.1: "しばらくすると熟成し、チーズホイールになります。"
    gui.special_recipe.trailandtales_delight.curd_aging.input: "凝乳ブロック"
    gui.special_recipe.trailandtales_delight.curd_aging.output: "チーズホイール"
  ko_kr:
    gui.special_recipe.trailandtales_delight.curd_aging.title: "커드 숙성"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.0: "커드 블록을 밝기 8 이하인 곳에 놓으세요."
    gui.special_recipe.trailandtales_delight.curd_aging.desc.1: "시간이 지나면 숙성되어 치즈 휠이 됩니다."
    gui.special_recipe.trailandtales_delight.curd_aging.input: "커드 블록"
    gui.special_recipe.trailandtales_delight.curd_aging.output: "치즈 휠"
  zh_tw:
    gui.special_recipe.trailandtales_delight.curd_aging.title: "凝乳塊熟成"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.0: "將凝乳塊放置在亮度不高於 8 的地方。"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.1: "靜置一段時間後，它會熟成為起司輪。"
    gui.special_recipe.trailandtales_delight.curd_aging.input: "凝乳塊"
    gui.special_recipe.trailandtales_delight.curd_aging.output: "起司輪"
  de_de:
    gui.special_recipe.trailandtales_delight.curd_aging.title: "Quarkreifung"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.0: "Platziere einen Quarkblock an einem Ort mit Lichtstärke 8 oder weniger."
    gui.special_recipe.trailandtales_delight.curd_aging.desc.1: "Nach einiger Zeit reift er zu einem Käsrad."
    gui.special_recipe.trailandtales_delight.curd_aging.input: "Quarkblock"
    gui.special_recipe.trailandtales_delight.curd_aging.output: "Käsrad"
  fr_fr:
    gui.special_recipe.trailandtales_delight.curd_aging.title: "Affinage du caillé"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.0: "Placez un bloc de caillé dans un endroit dont le niveau de lumière est inférieur ou égal à 8."
    gui.special_recipe.trailandtales_delight.curd_aging.desc.1: "Après un certain temps, il s’affine en meule de fromage."
    gui.special_recipe.trailandtales_delight.curd_aging.input: "Bloc de caillé"
    gui.special_recipe.trailandtales_delight.curd_aging.output: "Meule de fromage"
  es_es:
    gui.special_recipe.trailandtales_delight.curd_aging.title: "Maduración de la cuajada"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.0: "Coloca un bloque de cuajada donde el nivel de luz sea 8 o inferior."
    gui.special_recipe.trailandtales_delight.curd_aging.desc.1: "Con el tiempo madurará y se convertirá en una rueda de queso."
    gui.special_recipe.trailandtales_delight.curd_aging.input: "Bloque de cuajada"
    gui.special_recipe.trailandtales_delight.curd_aging.output: "Rueda de queso"
  ru_ru:
    gui.special_recipe.trailandtales_delight.curd_aging.title: "Созревание творожной массы"
    gui.special_recipe.trailandtales_delight.curd_aging.desc.0: "Поместите творожный блок туда, где уровень освещения не выше 8."
    gui.special_recipe.trailandtales_delight.curd_aging.desc.1: "Через некоторое время он созреет и превратится в круг сыра."
    gui.special_recipe.trailandtales_delight.curd_aging.input: "Творожный блок"
    gui.special_recipe.trailandtales_delight.curd_aging.output: "Круг сыра"
