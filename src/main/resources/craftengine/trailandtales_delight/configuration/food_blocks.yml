templates:
  trailandtales_delight:sliceable_food:
    settings:
      can_occlude: false
      is_view_blocking: false
      use_shape_for_light_occlusion: false
      light_dampening: 0
      support_shape: minecraft:air
      push_reaction: destroy
      hardness: 0.5
      template:
        - default:hardness/none
      tags:
        - farmersdelight:pies
        - farmersdelight:mineable/knife
      sounds:
        break: minecraft:block.wool.break
        fall: minecraft:block.wool.fall
        hit: minecraft:block.wool.hit
        place: minecraft:block.wool.place
        step: minecraft:block.wool.step
    states:
      properties:
        bites:
          type: int
          default: 0
          range: 0~3
        facing:
          type: 4-direction
          default: north
      appearances:
        bite0_east:
          state: structure_void
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:${__ID__}_display_0
            scale: 1.0
            translation: 0,0,0
            yaw: 90
        bite0_north:
          state: structure_void
          transparent: true
          entity_renderer:
            type: item_display
            item: trailandtales_delight:${__ID__}_display_0
            scale: 1.0
            translation: 0,0,0
        bite0_south:
