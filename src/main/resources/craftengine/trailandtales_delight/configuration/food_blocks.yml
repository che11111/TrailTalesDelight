        hit: minecraft:block.metal.hit
        place: minecraft:block.metal.place
        step: minecraft:block.metal.step
    states:
      properties:
        servings:
          type: int
          default: 4
          range: 0~4

blocks:
  trailandtales_delight:cherry_cake:
    template: trailandtales_delight:sliceable_food
    loot:
      pools:
        - rolls: 1
          conditions:
            - type: match_block_property
              properties:
                bites: 0
          entries:
            - type: item
              item: trailandtales_delight:cherry_cake
              count: 1

  trailandtales_delight:cherry_cheese_pie:
